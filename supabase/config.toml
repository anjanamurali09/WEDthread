# Google redirects the browser here after consent, so it can't carry a Supabase JWT.
# The function verifies the signed state itself (and the JWT manually for its other actions).
[functions.google-oauth]
verify_jwt = false

# Stripe calls this directly and cannot send a Supabase JWT; the function verifies Stripe's
# signature itself (STRIPE_WEBHOOK_SECRET) and rejects anything that isn't signed.
[functions.stripe-webhook]
verify_jwt = false
